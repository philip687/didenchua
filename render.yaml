services:
  - type: web
    name: didenchua-bot
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CID
        sync: false
      - key: NAME
        value: Hoa Hiền
      - key: ROOM
        value: chua-1
      - key: SAFE_MODE
        value: "true"
      - key: RENDER_EXTERNAL_URL
        value: "https://didenchua-bot.onrender.com"
      - key: AUTH_TOKEN
        sync: false
      - key: NODE_VERSION
        value: "22"
